openapi: 3.0.3

info:
  title: Pollo Asado API
  description: API REST para la gestión de una pollería de pollo asado.
  version: 1.0.0

servers:
  - url: http://localhost:3000

tags:
  - name: Products
  - name: Customers
  - name: Orders

paths:

  /products:
    get:
      tags:
        - Products
      summary: Obtener todos los productos
      responses:
        '200':
          description: Lista de productos

    post:
      tags:
        - Products
      summary: Crear un producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Producto creado

  /products/{id}:
    get:
      tags:
        - Products
      summary: Obtener un producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto encontrado
        '404':
          description: Producto no encontrado

    put:
      tags:
        - Products
      summary: Actualizar un producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Producto actualizado

    delete:
      tags:
        - Products
      summary: Eliminar un producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Producto eliminado

  /customers:
    get:
      tags:
        - Customers
      summary: Obtener todos los clientes
      responses:
        '200':
          description: Lista de clientes

    post:
      tags:
        - Customers
      summary: Crear un cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '201':
          description: Cliente creado

  /customers/{id}:
    get:
      tags:
        - Customers
      summary: Obtener un cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cliente encontrado

    put:
      tags:
        - Customers
      summary: Actualizar un cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '200':
          description: Cliente actualizado

    delete:
      tags:
        - Customers
      summary: Eliminar un cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Cliente eliminado

  /orders:
    get:
      tags:
        - Orders
      summary: Obtener todos los pedidos
      responses:
        '200':
          description: Lista de pedidos

    post:
      tags:
        - Orders
      summary: Crear un pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Pedido creado

  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Obtener un pedido
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pedido encontrado

    put:
      tags:
        - Orders
      summary: Actualizar un pedido
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: Pedido actualizado

    delete:
      tags:
        - Orders
      summary: Eliminar un pedido
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Pedido eliminado

components:

  schemas:

    Product:
      type: object
      required:
        - name
        - price
        - category
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Pollo asado entero
        description:
          type: string
          example: Pollo asado entero con papas
        price:
          type: number
          example: 35000
        category:
          type: string
          example: Pollo

    Customer:
      type: object
      required:
        - name
        - phone
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Juan Pérez
        phone:
          type: string
          example: "3001234567"
        address:
          type: string
          example: Calle 10 # 20-30

    Order:
      type: object
      required:
        - customerId
        - total
        - status
      properties:
        id:
          type: integer
          example: 1
        customerId:
          type: integer
          example: 1
        total:
          type: number
          example: 45000
        status:
          type: string
          example: Pendiente
